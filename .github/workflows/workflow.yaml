name: Build and Release

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET Core SDK 6.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.x
      - name: Install dependencies for tests
         run: dotnet restore --ignore-failed-sources
      - name: Build test 
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity normal
  
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build . --file ./CollisionDetector/Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/traffic-dt-head-collision-handler

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/traffic-dt-head-collision-handler